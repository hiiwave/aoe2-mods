<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><title>Source to output coordinate map for a single vertical column</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#192b3c} .title{font-size:25px;font-weight:bold}.h{font-size:19px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.line{stroke:#8797a5;stroke-width:1.5;stroke-dasharray:5 5}.roof{fill:#d4a373;stroke:#704624;stroke-width:2}.wall{fill:#dce9ef;stroke:#406880;stroke-width:2}</style><text x="30" y="38" class="title">One image column: forward geometry and inverse sampling</text><text x="30" y="67" class="body">Image y increases downward. Example only: a = t = 200, b = 300, k = 0.60, d = 30.</text><text x="100" y="112" class="h">Source yₛ</text><text x="490" y="112" class="h">Output y</text><line x1="170" y1="135" x2="170" y2="450" stroke="#294f6b" stroke-width="3"/><path d="M163 440 L170 455 L177 440" fill="none" stroke="#294f6b" stroke-width="3"/><line x1="570" y1="135" x2="570" y2="450" stroke="#294f6b" stroke-width="3"/><path d="M563 440 L570 455 L577 440" fill="none" stroke="#294f6b" stroke-width="3"/><line x1="180" y1="150.0" x2="560" y2="248.0" stroke="#a75f24" stroke-width="2"/><circle cx="170" cy="150.0" r="5" fill="#a75f24"/><circle cx="570" cy="248.0" r="5" fill="#a75f24"/><text x="60" y="155.0" class="body">100</text><text x="585" y="253.0" class="body">170: Roof top</text><line x1="180" y1="290.0" x2="560" y2="332.0" stroke="#a75f24" stroke-width="2"/><circle cx="170" cy="290.0" r="5" fill="#a75f24"/><circle cx="570" cy="332.0" r="5" fill="#a75f24"/><text x="60" y="295.0" class="body">200</text><text x="585" y="337.0" class="body">230: Roof / wall seam</text><line x1="180" y1="430.0" x2="560" y2="430.0" stroke="#25714b" stroke-width="2"/><circle cx="170" cy="430.0" r="5" fill="#25714b"/><circle cx="570" cy="430.0" r="5" fill="#25714b"/><text x="60" y="435.0" class="body">300</text><text x="585" y="435.0" class="body">300: Foot line (fixed)</text><text x="840" y="145" class="h">Forward map</text><text x="840" y="180" class="body">Roof: y = a + k(yₛ − a) + d</text><text x="840" y="215" class="body">Seam: n = 230</text><text x="840" y="250" class="body">Wall: [200, 300] → [230, 300]</text><text x="840" y="285" class="body">Ground: y = yₛ</text><text x="840" y="340" class="h">Inverse sampling</text><text x="840" y="375" class="body">For each output pixel, look up</text><text x="840" y="400" class="body">its corresponding source position.</text><text x="840" y="425" class="body">This avoids forward-map holes.</text><text x="30" y="490" class="body">Continuity: the roof and wall both map the original seam t to the new seam n; the foot line b stays fixed.</text><text x="30" y="525" class="body">Required: k &gt; 0 and n &lt; b. If n reaches b, the wall band collapses; if n exceeds b, its orientation reverses.</text><text x="30" y="555" class="small">Production uses traced t(x), b(x), aligned sprite layers and pixel sampling; this diagram is not a measured house.</text></svg>