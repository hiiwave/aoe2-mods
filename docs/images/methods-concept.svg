<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><title>Conceptual comparison of roof shifting and flattening</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#192b3c} .title{font-size:25px;font-weight:bold}.h{font-size:19px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.line{stroke:#8797a5;stroke-width:1.5;stroke-dasharray:5 5}.roof{fill:#d4a373;stroke:#704624;stroke-width:2}.wall{fill:#dce9ef;stroke:#406880;stroke-width:2}</style><text x="30" y="38" class="title">What changes: roof, wall, or both?</text><text x="30" y="65" class="body">Conceptual cross-section, not a game sprite. Width and ground line stay fixed.</text><text x="40" y="110" class="h">Original</text><line x1="40" y1="350" x2="340" y2="350" stroke="#274858" stroke-width="3"/><rect class="wall" x="90" y="250" width="180" height="100"/><path class="roof" d="M75 250 L180 150 L285 250 Z"/><line class="line" x1="50" y1="250" x2="320" y2="250"/><text x="60" y="381" class="body">Roof rise: 100</text><text x="60" y="407" class="body">Wall band: 100</text><text x="400" y="110" class="h">Roof-Shift Hybrid</text><line x1="400" y1="350" x2="700" y2="350" stroke="#274858" stroke-width="3"/><rect class="wall" x="450" y="280" width="180" height="70"/><path class="roof" d="M435 280 L540 220 L645 280 Z"/><line class="line" x1="410" y1="250" x2="680" y2="250"/><text x="420" y="381" class="body">Roof rise: 60; roof shifts down 30</text><text x="420" y="407" class="body">Wall band: 70 (compressed)</text><text x="760" y="110" class="h">Roof-Flatten</text><line x1="760" y1="350" x2="1060" y2="350" stroke="#274858" stroke-width="3"/><rect class="wall" x="810" y="250" width="180" height="100"/><path class="roof" d="M795 250 L900 190 L1005 250 Z"/><line class="line" x1="770" y1="250" x2="1040" y2="250"/><text x="780" y="381" class="body">Roof rise: 60; eaves unchanged</text><text x="780" y="407" class="body">Wall band: 100 (unchanged)</text><text x="30" y="450" class="small">Dashed line: original eave level. Hybrid example: roof scale k = 0.60, shift d = 30, anchor at original eaves.</text><text x="30" y="478" class="small">The same roof scale does NOT imply the same total-house height. Actual sprite profiles vary with horizontal position.</text></svg>